---
name: pre-commit

on:
  pull_request:
  push:
    branches:
      - develop
      - stage
      - main

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.3.1
      - uses: actions/setup-python@v5.6.0
        with:
          python-version-file: ".python-version"
      - uses: pre-commit/action@v3.0.1
